name: RC02 mobile browser regression
on:
  push:
    branches:
      - test-modular-upload-rc02
    paths:
      - .github/workflows/rc02-browser-qa.yml
      - tools/qa_browser.py
      - index.html
      - css/**
      - js/**
      - assets/**
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-qa:
    if: github.ref == 'refs/heads/test-modular-upload-rc02'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ${{ matrix.browser }} and browser testing package
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Serve actual modular files over HTTP
        run: |
          nohup python -m http.server 8877 --bind 127.0.0.1 > /tmp/tapgacha-http.log 2>&1 &
          python - <<'PY'
          import time, urllib.request
          for attempt in range(40):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:8877/index.html',timeout=2) as response:
                      assert response.status == 200
                  print('HTTP server ready')
                  break
              except Exception:
                  time.sleep(.25)
          else: raise SystemExit('HTTP server unavailable')
          PY
      - name: Test gameplay and save reload in ${{ matrix.browser }} mobile viewport
        env:
          QA_BROWSER: ${{ matrix.browser }}
        run: python tools/qa_browser.py
      - name: Publish screenshots and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc02-mobile-browser-qa-${{ matrix.browser }}
          path: |
            qa-screenshots/*.png
            qa-results-${{ matrix.browser }}.json
          if-no-files-found: warn
          retention-days: 14
